<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Stretch</title>
<meta name="description" content="One stretch a day. Today's pick, how to do it, and how long to hold it.">
<meta name="theme-color" content="#f2efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12100c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body data-scene="brief">

<div class="app">

  <header class="hud">
    <div class="hud-id">
      <span class="wordmark">Daily Stretch</span>
      <span class="date" id="date"></span>
    </div>
    <div class="streak-chip" id="streak-chip">
      <svg class="flame" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2c.6 3.4-1.2 4.6-2.7 6.1C7.5 9.9 6 11.7 6 14.3 6 18 8.9 21 12.4 21S19 18.2 19 14.6c0-2.8-1.4-4.4-2.6-6-.5 1-1.2 1.7-2 2.1.5-3.4-.9-6.5-2.4-8.7Z"/>
      </svg>
      <span class="streak-num" id="streak-count">0</span>
    </div>
  </header>

  <main class="stage">
    <div class="arena" id="arena">
      <div class="art" id="art">
        <img class="photo" id="photo" alt="" hidden>
        <svg class="figure" id="figure" viewBox="0 0 200 220" role="img" aria-labelledby="figure-title">
          <title id="figure-title">Illustration of today's stretch</title>
          <defs>
            <marker id="fig-arrowhead" viewBox="0 0 10 10" refX="7" refY="5"
                    markerWidth="5" markerHeight="5" orient="auto-start-reverse">
              <path d="M0 1 L9 5 L0 9 z" class="fig-arrowhead"/>
            </marker>
          </defs>
          <g id="figure-body"></g>
        </svg>
      </div>

      <svg class="ring" viewBox="0 0 200 300" aria-hidden="true">
        <rect class="ring-track" x="2" y="2" width="196" height="296" rx="21" vector-effect="non-scaling-stroke"/>
        <rect class="ring-progress" id="dial-progress" x="2" y="2" width="196" height="296" rx="21" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>

    <div class="caption" aria-live="polite">
      <p class="area" id="area"></p>
      <h1 class="name" id="name"></h1>
      <p class="hold" id="hold"></p>

      <div class="readout">
        <span class="count" id="dial-count">0</span>
        <span class="phase" id="dial-phase"></span>
      </div>
    </div>
  </main>

  <div class="controls">
    <button class="btn-primary" id="start" type="button">Start</button>
    <div class="control-row">
      <button class="btn-ghost" id="howto-open" type="button">How to do it</button>
      <span class="control-sep" id="control-sep" aria-hidden="true"></span>
      <button class="btn-ghost" id="mark-done" type="button">Mark today done</button>
    </div>
    <div class="chain" id="dots" aria-hidden="true"></div>
    <p class="streak-sub" id="streak-sub"></p>
  </div>

</div>

<!-- ------------------------------------------------------------- how-to sheet -->
<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="howto" hidden aria-labelledby="sheet-name" role="dialog" aria-modal="true">
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-body">
    <p class="area" id="sheet-area"></p>
    <h2 class="sheet-name" id="sheet-name"></h2>
    <p class="setup" id="setup"></p>
    <ol class="steps" id="steps"></ol>
    <p class="note" id="note"></p>
  </div>
  <button class="btn-primary btn-sheet-close" id="howto-close" type="button">Got it</button>
</section>

<!-- --------------------------------------------------------------- finale -->
<section class="finale" id="finale" hidden role="dialog" aria-modal="true" aria-labelledby="finale-count">
  <div class="rays" aria-hidden="true"></div>
  <p class="finale-kicker" id="finale-kicker">Held it.</p>
  <p class="finale-count" id="finale-count">1</p>
  <p class="finale-word" id="finale-word">days in a row</p>
  <p class="finale-sub" id="finale-sub"></p>
  <button class="btn-primary" id="finale-close" type="button">Nice</button>
</section>

<script src="stretches.js"></script>
<script src="figures.js"></script>
<script src="rotation.js"></script>
<script src="app.js"></script>
</body>
</html>
